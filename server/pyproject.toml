[project]
name = "noscia"
version = "0.1.0"
description = "Company-internal ESG neural-search backend (FastAPI)."
readme = "README.md"
authors = [
    { name = "6imeon", email = "260094322+6imeon@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "psycopg[binary]",
    "pgvector",
    "sqlalchemy",
    "crawl4ai>=0.8.9",
    "sentence-transformers>=5.5.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# 7-day dependency cooldown (CLAUDE.md rule 2), baked in so it's durable: every
# `uv lock`/`uv sync`/`uv run` honors it, not just a one-shot `--exclude-newer`
# flag. Renovate (PyPI, 7-day minimumReleaseAge) advances this cutoff over time
# behind review. Never widen it to bypass the cooldown for a brand-new release;
# pin the most recent version already >7 days old instead.
exclude-newer = "2026-06-07T00:00:00Z"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
