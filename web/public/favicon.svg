<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Noscia mark: "Neural-N" — the letter N drawn as a node-edge graph
       (neural / embedding retrieval). App-icon tile for the browser tab. -->
  <rect width="64" height="64" rx="14" fill="#2c2925"/>
  <g stroke="#e6a86f" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="47" x2="20" y2="17"/>
    <line x1="20" y1="17" x2="44" y2="47"/>
    <line x1="44" y1="47" x2="44" y2="17"/>
  </g>
  <g fill="#e6a86f">
    <circle cx="20" cy="17" r="5.4"/>
    <circle cx="20" cy="47" r="5.4"/>
    <circle cx="44" cy="17" r="5.4"/>
    <circle cx="44" cy="47" r="5.4"/>
  </g>
  <!-- central hub, highlighted in cream -->
  <circle cx="32" cy="32" r="5.4" fill="#f4ecdd"/>
</svg>
