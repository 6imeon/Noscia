# Noscia ESG corpus seeds.
#
# Curated, narrow, vertical — quality over coverage (CLAUDE.md rule 11). Every seed
# is an *authoritative ESG domain*: a standard-setter, regulator, ratings provider,
# NGO/target-setter, or domain newswire. We never crawl the open web (rule 13) — depth
# comes from following each authoritative site's own internal links, nothing else.
#
# `source_type` MUST be one of the contract's SourceType literals (framework |
# regulator | ratings | report | ngo | news) — it drives the §8.2 color tokens in the
# UI. `cadence` is the recrawl rhythm (Phase 2 acts on it; frameworks churn slowly,
# ratings/news fast).
#
# `crawl:` (optional) bounds the per-seed deep crawl:
#   max_depth : link-follow depth from the seed. 0 = just the seed page.
#   max_pages : hard cap on pages for this seed (BFS stops here).
#   exclude   : extra glob patterns to skip, on top of the global junk list
#               (login/search/taxonomy/legal — see ingest/run.py DEFAULT_EXCLUDE).
# Omit `crawl:` to take the defaults (depth 1, 25 pages). Same-domain only, non-HTML
# (PDFs etc.) dropped automatically. Total caps here target a ~300–500 page index.
#
# Add seeds via the Corpus view or by editing here, then
# `uv run python -m noscia.ingest.run` (or `--due` for cadence-only recrawl).

seeds:
  # --- frameworks & standards ------------------------------------------------
  - url: https://ghgprotocol.org/standards
    source_type: framework
    org: GHG Protocol
    cadence: monthly
    crawl: { max_depth: 2, max_pages: 30 }
  - url: https://www.globalreporting.org/standards/
    source_type: framework
    org: GRI
    cadence: monthly
    crawl: { max_depth: 2, max_pages: 30 }
  - url: https://www.fsb-tcfd.org/recommendations/
    source_type: framework
    org: TCFD
    cadence: monthly
    crawl: { max_depth: 1, max_pages: 15 }
  - url: https://tnfd.global/recommendations-of-the-tnfd/
    source_type: framework
    org: TNFD
    cadence: monthly
    crawl: { max_depth: 2, max_pages: 25 }
  - url: https://sasb.ifrs.org/standards/
    source_type: framework
    org: SASB / IFRS
    cadence: monthly
    crawl: { max_depth: 2, max_pages: 25 }
  - url: https://integratedreporting.ifrs.org/the-integrated-reporting-framework/
    source_type: framework
    org: Integrated Reporting
    cadence: monthly
    crawl: { max_depth: 1, max_pages: 15 }

  # --- regulators & standard-setters ----------------------------------------
