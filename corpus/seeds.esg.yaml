  - url: https://www.spglobal.com/esg/
    source_type: ratings
    org: S&P Global ESG
    cadence: weekly
    crawl: { max_depth: 1, max_pages: 20 }

  # --- NGOs & target-setting -------------------------------------------------
  - url: https://sciencebasedtargets.org/how-it-works
    source_type: ngo
    org: SBTi
    cadence: weekly
    crawl: { max_depth: 2, max_pages: 30 }
  - url: https://www.cdp.net/en/guidance
