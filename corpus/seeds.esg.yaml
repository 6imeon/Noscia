    source_type: regulator
    org: IFRS / ISSB
    cadence: monthly
    crawl: { max_depth: 2, max_pages: 30 }
  - url: https://finance.ec.europa.eu/capital-markets-union-and-financial-markets/company-reporting-and-auditing/company-reporting/corporate-sustainability-reporting_en
    source_type: regulator
    org: European Commission (CSRD)
    cadence: monthly
    crawl: { max_depth: 2, max_pages: 25 }
  - url: https://www.efrag.org/en/sustainability-reporting
    source_type: regulator
    org: EFRAG (ESRS)
    cadence: monthly
    crawl: { max_depth: 2, max_pages: 25 }
  - url: https://www.sec.gov/securities-topics/climate-esg
    source_type: regulator
    org: US SEC
    cadence: weekly
    crawl: { max_depth: 1, max_pages: 15 }

  # --- ratings ---------------------------------------------------------------
